# Render Blueprint. In Render: New > Blueprint, point at this repo.
# Set ANTHROPIC_API_KEY as a secret in the dashboard (sync: false keeps it out of git).
# Uses Docker (oven/bun image) so Bun is guaranteed on the host.
services:
  - type: web
    name: colin-college-pathway
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    autoDeploy: true
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
