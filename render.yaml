# Render Blueprint — static site (no backend, no secrets).
# In Render: New > Blueprint, point at this repo, click Apply. Free, global CDN, no cold starts.
services:
  - type: web
    name: colin-college-pathway
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
